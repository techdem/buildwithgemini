<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Recipe Agent</title>
<!-- Modern Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<style>
  :root {
    --accent: #ea580c;
    --accent-dark: #c2410c;
    --accent-gradient: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
    --bg: #fafaf9;
    --header-bg: rgba(255, 255, 255, 0.88);
    --card-bg: #ffffff;
    --text-primary: #1c1917;
    --text-secondary: #78716c;
    --border: #e7e5e4;
    --border-hover: #d6d3d1;
    --msg-agent-bg: #ffffff;
    --msg-agent-avatar-bg: #f5f5f4;
    --shadow-sm: 0 2px 4px rgba(0,0,0,0.03);
    --shadow-md: 0 4px 14px rgba(234,88,12,0.08);
    --shadow-bubble: 0 2px 8px rgba(0,0,0,0.04);
  }

  [data-theme="dark"] {
    --accent: #f97316;
    --accent-dark: #ea580c;
    --accent-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
    --bg: #121212;
    --header-bg: rgba(24, 24, 27, 0.88);
    --card-bg: #1e1e24;
    --text-primary: #f5f5f4;
    --text-secondary: #a8a29e;
    --border: #2e2e38;
    --border-hover: #444452;
    --msg-agent-bg: #1e1e24;
    --msg-agent-avatar-bg: #27272a;
    --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 14px rgba(249,115,22,0.15);
    --shadow-bubble: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* Header Bar */
  header {
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25);
  }

  .header-title-group h1 {
    font-family: 'Outfit', sans-serif;
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: #22c55e;
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .header-btn {
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .header-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* Chat Log Area */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    scroll-behavior: smooth;
  }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Message Animation & Formatting */
  .msg {
    display: flex;
    gap: 0.65rem;
    align-items: flex-start;
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    justify-content: flex-end;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--msg-agent-avatar-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .msg-content-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-width: 82%;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    background: var(--msg-agent-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    line-height: 1.55;
    font-size: 0.95rem;
    box-shadow: var(--shadow-bubble);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 3px 10px rgba(234, 88, 12, 0.25);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Quick Actions underneath Agent Replies */
  .quick-actions {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.2rem;
  }

  .action-chip {
    padding: 0.3rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .action-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg);
  }

  /* Animated Cooking Loading Indicator */
  .cooking-loader {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.8rem 1.1rem;
    border-radius: 16px;
    border-top-left-radius: 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 500;
  }

  .cooking-icon {
    font-size: 1.2rem;
    animation: panBounce 1s ease-in-out infinite alternate;
  }

  @keyframes panBounce {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(-4px) rotate(-12deg); }
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--accent);
    animation: typingWave 1.2s infinite ease-in-out;
  }

  .typing-dots span:nth-child(1) { animation-delay: 0s; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingWave {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Dietary Tags & Prompts Section */
  .controls-section {
    padding: 0.5rem 1.5rem 0.2rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .dietary-tags-row {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .dietary-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin-right: 0.3rem;
  }

  .dietary-tag {
    padding: 0.3rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .dietary-tag.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
  }

  .examples {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .example-btn {
    padding: 0.45rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.83rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .example-btn:hover {
    background: var(--card-bg);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* Form Input Controls */
  .form-wrapper {
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 0.85rem 1.5rem 1.1rem;
  }

  form {
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 0.6rem;
    position: relative;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--card-bg);
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px rgba(234, 88, 12, 0.15);
  }

  input::placeholder { color: var(--text-secondary); }

  button.send-btn {
    padding: 0.85rem 1.35rem;
    border: none;
    border-radius: 14px;
    background: var(--accent-gradient);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button.send-btn:hover {
    opacity: 0.94;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
  }

  /* Slide-Out Side Drawer (Saved Recipes / Meal Plan) */
  .drawer-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .drawer-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer {
    position: fixed;
    top: 0; right: -380px; width: 380px; height: 100%;
    background: var(--card-bg);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    z-index: 101;
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
  }

  .drawer.open { right: 0; }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1rem;
  }

  .drawer-header h2 {
    font-family: 'Outfit', sans-serif;
    margin: 0;
    font-size: 1.2rem;
    color: var(--text-primary);
  }

  .close-btn {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-secondary);
  }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .recipe-card-preview {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem;
    background: var(--bg);
  }

  .recipe-card-preview h4 { margin: 0 0 0.3rem; font-size: 0.95rem; }
  .recipe-card-preview p { margin: 0; font-size: 0.83rem; color: var(--text-secondary); }

  /* Food Photo Lightbox Modal */
  .lightbox-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .lightbox-modal.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-img {
    max-width: 90%;
    max-height: 75vh;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    object-fit: contain;
  }

  .lightbox-actions {
    margin-top: 1.2rem;
    display: flex;
    gap: 0.75rem;
  }

  .lightbox-btn {
    padding: 0.6rem 1.2rem;
    border-radius: 20px;
    border: none;
    background: #ffffff;
    color: #1c1917;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .lightbox-btn:hover { transform: scale(1.05); }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-sm);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.55rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.015); }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-brand">
    <div class="header-avatar">👨‍🍳</div>
    <div class="header-title-group">
      <h1>Smart Recipe Agent</h1>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>Online • AI Recipe & Meal Assistant</span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <button id="theme-toggle" class="header-btn" title="Toggle Light/Dark Theme">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Dark</span>
    </button>
    <button id="drawer-toggle" class="header-btn" title="View Saved Recipes & Meal Plan">
      <span>📖</span>
      <span>Saved Recipes</span>
    </button>
  </div>
</header>

<!-- Main Chat Log -->
<div id="log"></div>

<!-- Dietary Tag & Prompts Section -->
<div class="controls-section">
  <div class="dietary-tags-row">
    <span class="dietary-label">Dietary:</span>
    <button type="button" class="dietary-tag" onclick="toggleDietaryTag(this, 'Vegetarian')">🌱 Vegetarian</button>
    <button type="button" class="dietary-tag" onclick="toggleDietaryTag(this, 'Gluten-Free')">🌾 Gluten-Free</button>
    <button type="button" class="dietary-tag" onclick="toggleDietaryTag(this, 'Peanut-Free')">🥜 Peanut-Free</button>
    <button type="button" class="dietary-tag" onclick="toggleDietaryTag(this, 'Keto')">🥩 Keto</button>
    <button type="button" class="dietary-tag" onclick="toggleDietaryTag(this, 'Dairy-Free')">🥛 Dairy-Free</button>
  </div>

  <div class="examples">
    <button type="button" class="example-btn" onclick="sendPrompt('Find a quick dinner recipe for pasta')">🍝 Find a quick pasta recipe</button>
    <button type="button" class="example-btn" onclick="sendPrompt('Find nearby grocery stores in San Francisco')">🛒 Find nearby grocery stores</button>
    <button type="button" class="example-btn" onclick="sendPrompt('Generate a food photo of a gourmet margherita pizza')">📸 Generate a pizza photo</button>
  </div>
</div>

<!-- Input Form -->
<div class="form-wrapper">
  <form id="form">
    <input id="input" placeholder="Ask for recipe ideas, stores, or meal plans…" autocomplete="off" autofocus>
    <button type="submit" class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<!-- Side Drawer (Saved Recipes) -->
<div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <div class="drawer-header">
    <h2>📖 Saved Recipes & Memory</h2>
    <button class="close-btn" onclick="closeDrawer()">&times;</button>
  </div>
  <div class="drawer-body">
    <div class="recipe-card-preview">
      <h4>🌱 Active Dietary Filters</h4>
      <p id="active-filters-text">No active filters selected.</p>
    </div>
    <div class="recipe-card-preview">
      <h4>🍝 Favorite Recipes</h4>
      <p>Click "Save to Favorites" under agent responses to store recipes here!</p>
    </div>
  </div>
</div>

<!-- Lightbox Modal for Food Photos -->
<div id="lightbox" class="lightbox-modal" onclick="closeLightbox(event)">
  <img id="lightbox-img" class="lightbox-img" src="" alt="Food Preview">
  <div class="lightbox-actions" onclick="event.stopPropagation()">
    <button class="lightbox-btn" onclick="requestRecipeFromLightbox()">🍝 Show Recipe</button>
    <button class="lightbox-btn" onclick="closeLightbox()">Close</button>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const activeDietary = new Set();

/* --- 1. Dark Mode Toggle --- */
const themeToggleBtn = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
const themeLabel = document.getElementById("theme-label");

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);
  if (theme === "dark") {
    themeIcon.textContent = "☀️";
    themeLabel.textContent = "Light";
  } else {
    themeIcon.textContent = "🌙";
    themeLabel.textContent = "Dark";
  }
}

themeToggleBtn.addEventListener("click", () => {
  const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
  setTheme(currentTheme === "dark" ? "light" : "dark");
});

// Initialize saved theme
if (localStorage.getItem("theme") === "dark") setTheme("dark");

/* --- 2. Side Drawer (Saved Recipes / Memory) --- */
const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawer-overlay");
document.getElementById("drawer-toggle").addEventListener("click", () => {
  drawer.classList.add("open");
  drawerOverlay.classList.add("open");
});

function closeDrawer() {
  drawer.classList.remove("open");
  drawerOverlay.classList.remove("open");
}

/* --- 3. Dietary Preference Quick Filter Tags --- */
function toggleDietaryTag(btn, tag) {
  if (activeDietary.has(tag)) {
    activeDietary.delete(tag);
    btn.classList.remove("active");
  } else {
    activeDietary.add(tag);
    btn.classList.add("active");
  }
  const filterText = document.getElementById("active-filters-text");
  filterText.textContent = activeDietary.size > 0 ? Array.from(activeDietary).join(", ") : "No active filters selected.";
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

/* --- 4. Lightbox Modal for Food Photos --- */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
let currentLightboxSrc = "";

function openLightbox(src) {
  currentLightboxSrc = src;
  lightboxImg.src = src;
  lightbox.classList.add("open");
}

function closeLightbox(ev) {
  if (!ev || ev.target === lightbox || ev.target.tagName === "BUTTON") {
    lightbox.classList.remove("open");
  }
}

function requestRecipeFromLightbox() {
  closeLightbox();
  sendPrompt("Can you give me a full recipe for this dish photo?");
}

/* --- Chat & Message Logic --- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const wrapper = el("div", "msg-content-wrapper");

  if (who === "agent") {
    const av = el("div", "msg-avatar", "🍳");
    m.appendChild(av);
  }
  
  const b = el("div", "bubble");
  wrapper.appendChild(b);
  m.appendChild(wrapper);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return { container: b, wrapper: wrapper };
}

function createCookingLoader() {
  const m = el("div", "msg agent");
  const av = el("div", "msg-avatar", "🍳");
  m.appendChild(av);

  const loader = el("div", "cooking-loader");
  loader.innerHTML = `
    <span class="cooking-icon">🍳</span>
    <span class="loading-text">Cooking up a response...</span>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  `;
  m.appendChild(loader);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

/* --- Quick Action Buttons underneath Agent Responses --- */
function attachQuickActions(wrapper, textContent) {
  const actionsRow = el("div", "quick-actions");
  
  const copyBtn = el("button", "action-chip", "📋 Copy Recipe");
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(textContent);
    copyBtn.textContent = "✅ Copied!";
    setTimeout(() => copyBtn.textContent = "📋 Copy Recipe", 2000);
  };

  const storeBtn = el("button", "action-chip", "🛒 Find Nearby Stores");
  storeBtn.onclick = () => sendPrompt("Find nearby grocery stores selling these ingredients");

  const photoBtn = el("button", "action-chip", "📸 Generate Dish Photo");
  photoBtn.onclick = () => sendPrompt("Generate a food photo preview for this dish");

  actionsRow.appendChild(copyBtn);
  actionsRow.appendChild(storeBtn);
  actionsRow.appendChild(photoBtn);
  wrapper.appendChild(actionsRow);
}

/* --- A2UI Mini-Renderer v0.8 --- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Food image";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(bubbleObj, parts) {
  const b = bubbleObj.container;
  const wrapper = bubbleObj.wrapper;
  b.textContent = "";
  
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    b.appendChild(el("div", null, textStr));
    attachQuickActions(wrapper, textStr);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  let text = input.value.trim();
  if (!text) return;

  // Append active dietary tags if selected
  if (activeDietary.size > 0) {
    const tagsStr = Array.from(activeDietary).join(", ");
    text += ` (Note dietary preferences: ${tagsStr})`;
  }

  bubble("user").container.textContent = text;
  input.value = "";
  
  const loaderElem = createCookingLoader();
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    loaderElem.remove();

    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    const bObj = bubble("agent");
    renderReply(bObj, data.parts || []);
  } catch (e) {
    loaderElem.remove();
    const bObj = bubble("agent");
    bObj.container.textContent = "Error: " + e.message;
  }
});
</script>
